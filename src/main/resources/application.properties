spring.application.name=triage-service
server.port=${PORT:8081}

# Perfil por defecto: dev. En Docker/K8s se sobreescribe con SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Kafka
triage.kafka.topic=triaje.eventos

# SLA por nivel en minutos (RN-02). Valores reales del negocio
triage.sla.critico=5
triage.sla.urgente=10
triage.sla.urgente-2=30
triage.sla.no-urgente=60
triage.sla.no-urgente-2=120
triage.escalamiento.intervalo-segundos=30

# Probes de health (liveness/readiness)
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true