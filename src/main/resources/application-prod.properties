# Todo por variable de entorno, SIN defaults: si falta una, la app no arranca
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${DB_PASSWORD}
triage.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}
triage.security.api-key=${API_KEY}

# Pool de conexiones acotado
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# Observabilidad mínima expuesta
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Logs JSON estructurados (para Azure Monitor / Loki / etc.)
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.vidacruz=INFO

triage.alertas.webhook-url=${ALERTAS_WEBHOOK_URL:}