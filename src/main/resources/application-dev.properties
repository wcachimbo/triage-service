# Conexiones locales (docker compose up -d de la infra)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/triage
spring.r2dbc.username=triage
spring.r2dbc.password=triage
triage.kafka.bootstrap-servers=localhost:9092

# SLA cortos para probar el escalamiento sin esperar decenas de minutos
triage.sla.critico=1
triage.sla.urgente=2
triage.sla.urgente-2=3
triage.sla.no-urgente=4
triage.sla.no-urgente-2=5
triage.escalamiento.intervalo-segundos=10

# API key de desarrollo (solo local)
triage.security.api-key=dev-key

# Observabilidad abierta para depurar
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logs legibles en consola
logging.level.com.vidacruz=DEBUG
logging.level.org.springframework.r2dbc=DEBUG

triage.alertas.webhook-url=${ALERTAS_WEBHOOK_URL:}